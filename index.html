<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>食光机 · 发现你的每日灵感菜单</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/welcome.css" />
  <link rel="stylesheet" href="css/recipes.css" />
  <link rel="stylesheet" href="css/detail.css" />
  <link rel="stylesheet" href="css/modals.css" />
  <link rel="stylesheet" href="css/mine.css" />
</head>
<body>

  <!-- ========== 第一屏：欢迎页 ========== -->
  <section id="screen-welcome" class="screen screen--active welcome">
    <div class="doodles" aria-hidden="true">
      <svg class="doodle doodle--tomato" viewBox="0 0 64 64"><circle cx="32" cy="40" r="19"/><path d="M21 22c5-4 17-4 22 0-4 4-8 5-11 5s-7-1-11-5z"/><path d="M32 17c0-5 4-8 9-8"/></svg>
      <svg class="doodle doodle--egg" viewBox="0 0 64 64"><path d="M18 34c-7-9 3-20 14-18 11 2 17 9 13 17-3 7-8 11-14 10-5-1-9-4-13-9z"/><circle cx="33" cy="30" r="6"/></svg>
      <svg class="doodle doodle--sparkle" viewBox="0 0 64 64"><path d="M32 6l5 21 21 5-21 5-5 21-5-21-21-5 21-5z"/></svg>
    </div>

    <div class="welcome__left">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="40" height="40">
          <!-- 叉子 -->
          <path d="M17 8v10a4 4 0 0 0 8 0V8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M21 8v32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
          <!-- 刀 -->
          <path d="M31 8c4 3 4 10 0 13v19" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 class="welcome__title"><span class="title-accent">食光</span>机</h1>
      <p class="welcome__subtitle">发现你的每日灵感菜单</p>
      <ul class="welcome__points">
        <li>📖 100+ 家常菜谱</li>
        <li>⏱ 30 分钟搞定晚餐</li>
        <li>✨ 每日灵感更新</li>
      </ul>

      <button id="btn-start" class="btn-start" type="button">
        开始使用
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="welcome__right">
      <div class="polaroid">
        <div class="photo">
          <img class="welcome__hero" src="assets/images/hero-food.jpg" alt="温馨家常菜餐桌" />
        </div>
        <div class="bubble bubble--question"><span id="bubble-text">今日吃什么？</span><span class="type-cursor" aria-hidden="true"></span></div>
      </div>
    </div>
  </section>

  <!-- ========== 第二屏：选择食谱 ========== -->
  <section id="screen-recipes" class="screen recipes">
    <header class="recipes__header">
      <div class="recipes__brand">
        <span class="brand-logo brand-logo--sm" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="22" height="22">
            <path d="M17 8v10a4 4 0 0 0 8 0V8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M21 8v32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M31 8c4 3 4 10 0 13v19" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="recipes__brand-name">食光机</span>
      </div>

      <div class="recipes__search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <input id="search-input" type="text" placeholder="搜索菜名或食材…" />
      </div>

      <button id="btn-back" class="btn-back" type="button" title="返回首页">返回首页</button>
    </header>

    <div class="quick-tools">
      <button id="btn-slot" class="tool-btn tool-btn--primary" type="button">🎲 今日灵感 · 抽一道</button>
      <button id="btn-fridge" class="tool-btn" type="button">🧊 冰箱找菜 · 有啥做啥</button>
      <button id="btn-mine" class="tool-btn" type="button">📖 我的食光 · 收藏与记录</button>
    </div>

    <div class="recipes__filters">
      <div class="filter-group">
        <span class="filter-label">分类</span>
        <nav class="recipes__cats" id="cats">
          <button class="cat cat--active" type="button" data-cat="全部">全部</button>
          <button class="cat" type="button" data-cat="家常菜">家常菜</button>
          <button class="cat" type="button" data-cat="快手菜">快手菜</button>
          <button class="cat" type="button" data-cat="汤羹粥品">汤羹粥品</button>
          <button class="cat" type="button" data-cat="主食">主食</button>
          <button class="cat" type="button" data-cat="甜品">甜品</button>
        </nav>
      </div>
      <div class="filter-group">
        <span class="filter-label">菜系</span>
        <nav class="recipes__cats" id="cuisines">
          <button class="cat cat--active" type="button" data-cuisine="不限">不限</button>
          <button class="cat" type="button" data-cuisine="鲁菜">鲁菜</button>
          <button class="cat" type="button" data-cuisine="川菜">川菜</button>
          <button class="cat" type="button" data-cuisine="粤菜">粤菜</button>
          <button class="cat" type="button" data-cuisine="苏菜">苏菜</button>
          <button class="cat" type="button" data-cuisine="浙菜">浙菜</button>
          <button class="cat" type="button" data-cuisine="闽菜">闽菜</button>
          <button class="cat" type="button" data-cuisine="湘菜">湘菜</button>
          <button class="cat" type="button" data-cuisine="徽菜">徽菜</button>
          <button class="cat" type="button" data-cuisine="西餐">西餐</button>
          <button class="cat" type="button" data-cuisine="日式">日式</button>
          <button class="cat" type="button" data-cuisine="韩式">韩式</button>
        </nav>
      </div>
      <div class="filter-group">
        <span class="filter-label">耗时</span>
        <nav class="recipes__cats" id="times">
          <button class="cat cat--active" type="button" data-time="all">不限</button>
          <button class="cat" type="button" data-time="20">≤20 分钟</button>
          <button class="cat" type="button" data-time="40">≤40 分钟</button>
          <button class="cat" type="button" data-time="41">40 分钟以上</button>
        </nav>
      </div>
      <div class="filter-group">
        <span class="filter-label">口味</span>
        <nav class="recipes__cats" id="flavors">
          <button class="cat cat--active" type="button" data-flavor="不限">不限</button>
          <button class="cat" type="button" data-flavor="辣">辣</button>
          <button class="cat" type="button" data-flavor="清淡">清淡</button>
          <button class="cat" type="button" data-flavor="酸甜">酸甜</button>
          <button class="cat" type="button" data-flavor="咸鲜">咸鲜</button>
        </nav>
      </div>
      <div class="filter-group">
        <span class="filter-label">难度</span>
        <nav class="recipes__cats" id="levels">
          <button class="cat cat--active" type="button" data-level="不限">不限</button>
          <button class="cat" type="button" data-level="简单">简单</button>
          <button class="cat" type="button" data-level="中等">中等</button>
        </nav>
      </div>
    </div>

    <main class="recipes__grid" id="recipe-grid">
      <!-- 卡片由 js/app.js 渲染 -->
    </main>

    <footer class="recipes__footer">食光机 · v0.2 · 选菜 → 详情 → 跟着做菜，全流程跑通</footer>
  </section>

  <!-- ========== 第三屏：菜谱详情 ========== -->
  <section id="screen-detail" class="screen detail">
    <header class="detail__header">
      <button id="btn-detail-back" class="btn-back" type="button">← 返回列表</button>
    </header>
    <div class="detail__body" id="detail-body">
      <!-- 详情内容由 js/app.js 渲染 -->
    </div>
  </section>

  <!-- ========== 第四屏：做菜模式 ========== -->
  <section id="screen-cooking" class="screen cooking">
    <header class="cooking__top">
      <button id="btn-cook-exit" class="cooking__exit" type="button">✕ 退出</button>
      <div class="cooking__name" id="cook-dish">菜名</div>
      <div class="cooking__count"><span id="cook-step-now">1</span> / <span id="cook-step-total">-</span></div>
    </header>
    <div class="cooking__bar"><i id="cook-progress"></i></div>
    <main class="cooking__main" id="cook-main">
      <div class="cooking__num" id="cook-num">1</div>
      <p class="cooking__text" id="cook-text"></p>
      <div class="cook-timer" id="cook-timer" hidden></div>
    </main>
    <footer class="cooking__nav">
      <button id="btn-prev" class="cooking__prev" type="button">← 上一步</button>
      <button id="btn-next" class="cooking__next" type="button">下一步 →</button>
    </footer>
  </section>

  <!-- ========== 第五屏：我的食光 ========== -->
  <section id="screen-mine" class="screen mine">
    <header class="mine__header">
      <button id="btn-mine-back" class="btn-back" type="button">← 返回列表</button>
      <h2 class="mine__title">📖 我的食光</h2>
    </header>
    <div class="mine__body" id="mine-body"><!-- 由 js/app.js 渲染 --></div>
  </section>

  <!-- 今日灵感老虎机弹窗 -->
  <div id="modal-mask" class="modal-mask" hidden>
    <div class="modal" id="slot-modal" hidden>
      <div class="modal__head">
        <h3 class="modal__title">🎲 今日灵感</h3>
        <button class="modal__close" data-close type="button">✕</button>
      </div>
      <div class="slot__stage" id="slot-stage">
        <div class="slot__emoji" id="slot-emoji">🍳</div>
        <div class="slot__name" id="slot-name">…</div>
        <div class="slot__meta" id="slot-meta">正在为你摇一道菜…</div>
      </div>
      <div class="modal__actions">
        <button class="btn-back" id="btn-slot-again" type="button">再抽一次 🎲</button>
        <button class="btn-start btn-start--modal" id="btn-slot-go" type="button">查看菜谱 →</button>
      </div>
    </div>

    <div class="modal modal--wide" id="fridge-modal" hidden>
      <div class="modal__head">
        <h3 class="modal__title">🧊 冰箱找菜</h3>
        <button class="modal__close" data-close type="button">✕</button>
      </div>
      <p class="fridge__hint">勾选家里现有的食材，看看现在就能做什么：</p>
      <div class="fridge__chips" id="fridge-chips"></div>
      <div class="fridge__results" id="fridge-results"></div>
    </div>

    <!-- 做饭记录弹窗（完成做菜后弹出） -->
    <div class="modal" id="record-modal" hidden>
      <div class="modal__head">
        <h3 class="modal__title">📖 记录这次做饭</h3>
        <button class="modal__close" data-close type="button">✕</button>
      </div>
      <p class="record__dish" id="record-dish">菜名</p>
      <div class="record__stars">
        <span class="filter-label">评分</span>
        <div class="record__star-row" id="record-star-row"></div>
      </div>
      <textarea id="record-note" class="record__note" rows="3" placeholder="写两句心得，下次做给自己看（比如：盐要少放）"></textarea>
      <div class="modal__actions">
        <button class="btn-back" id="btn-record-skip" type="button">跳过</button>
        <button class="btn-start btn-start--modal" id="btn-record-save" type="button">保存 📖</button>
      </div>
    </div>
  </div>

  <!-- 全局提示 -->
  <div id="toast" class="toast" role="status"></div>

  <!-- 依赖顺序：数据 → 存储 → 页面逻辑（详情/我的食光 在 app 通用层之后） -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/mine.js"></script>
</body>
</html>
